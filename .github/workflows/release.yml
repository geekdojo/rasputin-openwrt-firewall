name: release

# Build + sign + ship the Rasputin firewall (Node N) OpenWrt image.
#
# Mirror of rasputin-os's release workflow but adapted for OpenWrt:
#   - ImageBuilder (~5-10 min), then a genimage post-process that re-lays-out
#     its single-rootfs image into our custom A/B disk (scripts/assemble-ab-image.sh).
#   - Ships TWO signed artifacts: `*-ab.img.gz` (full A/B disk, initial flash)
#     and `*.rootfs` (bare rootfs squashfs, the OTA artifact the control plane
#     pushes into the inactive slot — custom A/B, no RAUC, no sysupgrade).
#   - detached CMS .sig signature, verified by rasputin-agent on the device
#     (same YubiKey-rooted PKI as rasputin-os; see os-images/release-pipeline.md §3)
#
# Triggers:
#   - push of a CalVer tag (e.g. 2026.07.1 or 2026.07.1-dev.1)
#                                       → validate + build + smoke + sign+release
#   - manual dispatch (full_build=true) → validate + build + smoke (no release, bench)
#   - manual dispatch (publish=true)    → build + sign + publish a dev release,
#       versioned ${vars.RASPUTIN_VERSION}-dev.<run> (dev.N = run number). The
#       release base comes from the org var RASPUTIN_VERSION, shared with
#       rasputin-os / -control-plane for lockstep. Implies full_build.
#   - manual dispatch (full_build=false) → validate only (default, cheap)
#
# Tag builds need a PRE-FLIGHT first (geekdojo/geekdojo-brain#208):
#   gh workflow run release.yml -f full_build=true --ref main
# on the exact commit you are about to tag. Every dispatch build runs the Snort
# rules freshness gate (upstream vs PINNED_SHA); tag builds do not, and instead
# the tag-guard job refuses to start unless a dispatch run on the same commit
# passed that gate. Upstream moving between the pre-flight and the tag cannot
# change what the tag builds: all builds fetch the rules from the org mirror at
# PINNED_SHA. So a Talos republish can fail a pre-flight — cheap, re-pin and
# re-run — but never burn an immutable tag.

on:
  push:
    tags:
      - "[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9]*"
  workflow_dispatch:
    inputs:
      full_build:
        description: "Run the ImageBuilder build + smoke (defaults to validate-only)"
        type: boolean
        default: false
      publish:
        description: "Sign + publish this build as a dev release (versioned from org var RASPUTIN_VERSION). Implies full_build."
        type: boolean
        default: false

permissions:
  contents: write   # create releases + upload assets

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # Runs on every trigger so `needs:` below never sees a skipped job; only tag
  # builds do anything. Fails BEFORE validate/build, so a refused tag has built,
  # signed and published nothing and can simply be re-run once the pre-flight is
  # green — the tag itself is not burned.
  tag-guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read   # list this workflow's runs, jobs and steps
    steps:
      - uses: actions/checkout@v4
        if: ${{ startsWith(github.ref, 'refs/tags/') }}

      # A tag build must not be the first build of its commit. The freshness gate
      # only runs on dispatch builds, so require a successful workflow_dispatch
      # run of this workflow on the EXACT commit being tagged whose build job
      # passed the "Snort rules freshness gate" step. The step is checked, not
      # just the run: a validate-only dispatch also concludes success.
      # 2026.09.2 was burned by a tag build that hit a Talos republish hours
      # after a green dispatch build. (geekdojo/geekdojo-brain#208)
      - name: Require a green pre-flight on this commit
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/rasputin-release-tag-guard.sh "$GITHUB_REPOSITORY" "$(git rev-parse 'HEAD^{commit}')"

      - name: Not a tag build
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: echo "dispatch build — no tag guard; the freshness gate runs in the build job instead"

  validate:
    needs: tag-guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # Syntax + executable modes + required paths. Extracted to a script so this job and
      # ci.yml (which gates pull requests) run the IDENTICAL checks from one file — the
      # inline copy that used to live here could only drift from whatever a PR-time check
      # did, and this repo has already paid for the same config living in two workflows
      # (the agent-version.txt pin). It also gained a mode check the inline version could
      # never have had: `bash -n` cannot see that an init script shipped non-executable,
      # which is how PR #26 published a fix that silently never ran.
      - name: Validate shipped files
        run: ./scripts/validate-files.sh

      # The node-id table tests ci.yml runs on every PR, run again here for the
      # same reason as the scrub test below. (geekdojo/geekdojo-brain#441)
      - name: Node-id helper tests
        timeout-minutes: 5
        env:
          REQUIRE_BUSYBOX: "1"
        run: sh scripts/test-node-id.sh

      # The bus-pin table tests ci.yml runs on every PR, for the same reason.
      # (geekdojo/geekdojo-brain#448)
      - name: Bus-pin helper tests
        timeout-minutes: 5
        env:
          REQUIRE_BUSYBOX: "1"
        run: sh scripts/test-bus-pin.sh

      # The set-root-hash table tests ci.yml runs on every PR, run again here.
      # (geekdojo/geekdojo-brain#558)
      - name: set-root-hash helper tests
        timeout-minutes: 5
        env:
          REQUIRE_BUSYBOX: "1"
        run: sh scripts/test-set-root-hash.sh

      # The mgmt-harden idempotency tests ci.yml runs on every PR, run again here.
      # (geekdojo/geekdojo-brain#503, #559)
      - name: mgmt-harden helper tests
        timeout-minutes: 5
        run: sh scripts/test-mgmt-harden.sh

      # rasputin-trust-clean deletes the overlay copy of the trust anchor so the
      # image's own anchor is the one in force (geekdojo/geekdojo-brain#531).
      # Both ways it can be wrong are silent at boot: leave the copy and the fix
      # did nothing; delete it on an image that ships no anchor and the box can
      # verify nothing at all.
      - name: trust-clean helper tests
        timeout-minutes: 5
        env:
          REQUIRE_BUSYBOX: "1"
        run: sh scripts/test-trust-clean.sh

      # The vendored agent's hash pin (geekdojo/geekdojo-brain#533). Runs before
      # the build job downloads the tarball, so a pin whose two lines disagree
      # stops the release here rather than after ImageBuilder.
      - name: Agent pin tests
        timeout-minutes: 5
        run: ./scripts/test-agent-pin.sh

      # Same reasoning as the static checks above: run the identical behavioural
      # test a PR faced, at the point a finding is most expensive to discover.
      # The seed scrub blanks a credential during first-boot provisioning, and
      # ImageBuilder packages files/ verbatim without executing anything — a
      # broken scrub would build, sign and publish cleanly.
      - name: Ensure mkfs.vfat is available
        timeout-minutes: 5
        run: |
          # Skip the package manager entirely when the tool is already here —
          # which on the hosted images it usually is. apt is the slowest and by
          # far the least reliable part of this job, so the best version of this
          # step is the one that does nothing.
          if command -v mkfs.vfat >/dev/null 2>&1; then
            echo "dosfstools already present at $(command -v mkfs.vfat)"
            exit 0
          fi
          # DPkg::Lock::Timeout so apt FAILS on a held lock instead of waiting
          # on it forever, and DEBIAN_FRONTEND so nothing can stop for a prompt
          # no one is there to answer.
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq -o DPkg::Lock::Timeout=120
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq -o DPkg::Lock::Timeout=120 dosfstools

      - name: Seed-scrub functional test
        timeout-minutes: 5
        env:
          REQUIRE_FAT: "1"
        run: ./scripts/test-seed-scrub.sh

      # The rules pin, freshness gate and tag guard are the release path's own
      # gates; run their unit tests (the same ones ci.yml runs on every PR)
      # before trusting them with a build. (geekdojo/geekdojo-brain#208)
      - name: Snort rules pin tests
        timeout-minutes: 5
        run: ./scripts/test-snort-rules-pin.sh

      - name: Tag guard tests
        timeout-minutes: 5
        run: ./scripts/test-release-tag-guard.sh

      - name: Release target guard tests
        timeout-minutes: 5
        run: ./scripts/test-release-target-guard.sh

  build:
    needs: validate
    # full_build arrives as a real boolean from the UI checkbox but as the
    # STRING "true" via the API / `gh -f`. Accept both. (Same gotcha as
    # rasputin-os.)
    if: ${{ startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && (inputs.full_build == true || inputs.full_build == 'true' || inputs.publish == true || inputs.publish == 'true')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute version (CalVer)
        id: ver
        # TARGET_VERSION = org var RASPUTIN_VERSION (current dev target,
        # YYYY.MM.MICRO), shared across the three Rasputin repos for lockstep.
        env:
          TARGET_VERSION: ${{ vars.RASPUTIN_VERSION }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            case "${GITHUB_REF_NAME}" in
              *-dev*) echo "channel=dev"    >> "$GITHUB_OUTPUT" ;;
              *)      echo "channel=stable" >> "$GITHUB_OUTPUT" ;;
            esac
          else
            if [ -z "${TARGET_VERSION}" ]; then
              echo "::error::org var RASPUTIN_VERSION is unset — set it to the current dev target (e.g. 2026.07.1): gh variable set RASPUTIN_VERSION --org geekdojo --body 2026.07.1 --visibility all"
              exit 1
            fi
            echo "version=${TARGET_VERSION}-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "channel=dev" >> "$GITHUB_OUTPUT"
          fi

      # The pinned agent MUST belong to the release being cut.
      #
      # It did not, for four consecutive stables. agent-version.txt was last
      # bumped 2026-07-19 to 2026.07.4, and firewall stables 2026.07.5, .6, .7
      # and .8 all shipped that same agent — so a box labelled 2026.07.8 ran a
      # 2026.07.4 agent, and nothing said so. The build validated only that the
      # file EXISTS and is non-empty, then downloaded whatever it named.
      #
      # This drifted because the firewall's release model is deliberately
      # independent — it needs no control-plane or OS build first, it just
      # downloads an already-published agent. That independence is about BUILD
      # ORDERING, and it quietly became independence of VERSION: nobody has to
      # bump the pin to cut a release, so eventually nobody did.
      #
      # "No functional agent change" is not a defence. It is a judgement that
      # can be wrong, it makes the version on the tin a lie, it creates
      # api/agent pairs nobody tests, and it withholds agent fixes from the one
      # node type sitting on the WAN edge.
      #
      # Stable: the pin must equal the tag exactly (hard gate, exit 1).
      # Dev:    the pin is NOT required to match. dev.N always differs — the two
      #         repos have independent run counters, so agent 2026.07.9-dev.79
      #         inside firewall 2026.07.9-dev.12 is correct, not drift — and a
      #         differing BASE only prints a ::warning:: and the build proceeds.
      #         See the DEV branch below for why.
      - name: Validate pinned agent vs release version
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          CHANNEL: ${{ steps.ver.outputs.channel }}
        run: |
          # One parser for the pin, so this gate and the download step can never
          # read agent-version.txt differently (geekdojo/geekdojo-brain#533).
          # `sha256` is called for its exit status: a pin whose two lines
          # disagree must stop the build HERE, before ImageBuilder runs, not at
          # the download step twenty minutes later.
          PIN=$(./scripts/agent-pin.sh version) || exit 1
          ./scripts/agent-pin.sh sha256 >/dev/null || exit 1
          base() { printf '%s' "${1%%-dev.*}"; }
          if [ "$CHANNEL" = stable ]; then
            # STABLE is lockstep: a stable ships the exact-version agent, and
            # stables go out at the SAME version across control-plane / os /
            # firewall at the same time (end-user usability — one version to
            # reason about), even for a repo that didn't otherwise change. This
            # stays a hard gate.
            if [ "$PIN" != "$VERSION" ]; then
              echo "::error::stable $VERSION would ship agent $PIN. A stable is lockstep: bump agent-version.txt to $VERSION (it must already be published on rasputin-control-plane) and add a changelog entry."
              exit 1
            fi
          else
            # DEV is NOT lockstep, deliberately (Bryce, 2026-08-07). A dev build
            # ships whatever agent is currently pinned so we can bench-test an
            # image change (an OpenWrt base bump, a package fix) WITHOUT first
            # cutting a stable just to line the versions up — that would churn
            # the stable line. The dev version tracks the org var's forward
            # target while the agent pin can trail on the last stable (or lead
            # on a dev agent); dev.N and even the base may differ between repos.
            # The only hard requirement is that the pin RESOLVES to a published
            # agent — the download step enforces that. Warn on a base mismatch
            # for visibility; never block.
            if [ "$(base "$PIN")" != "$(base "$VERSION")" ]; then
              echo "::warning::dev build $VERSION ships agent $PIN (base $(base "$PIN") vs dev target $(base "$VERSION")) — allowed: the agent is pinned independently of the dev version. Bump agent-version.txt when you want a newer agent in dev images."
            fi
          fi
          echo "pinned agent $PIN accepted for $CHANNEL release $VERSION"

      # Free space — ImageBuilder + downloaded packages comfortably fit on
      # a stock runner, but Suricata pulls in a sizable rule set and the
      # output image dir grows. Cheap insurance.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          df -h /

      # Cache the extracted ImageBuilder dir + the OpenWrt package
      # downloads it pulls during `make image`. Warm rebuilds skip the
      # ~200 MB IB tarball download AND the per-package downloads → a
      # warm CI run is ~3 min instead of ~10. Split restore/save with
      # if:always() so failed builds still warm the cache (same pattern
      # as rasputin-os).
      - name: Restore ImageBuilder + dl cache
        id: ibcache
        uses: actions/cache/restore@v4
        with:
          path: |
            imagebuilder
            imagebuilder/dl
          key: ib-${{ hashFiles('scripts/init-imagebuilder.sh', 'packages.txt') }}
          restore-keys: ib-

      - name: Init OpenWrt ImageBuilder (download if not cached)
        run: ./scripts/init-imagebuilder.sh

      # The agent binary lives in the (now-public) control-plane release;
      # github.token reads it (was a fine-grained PAT while control-plane was
      # private — ADR-0002). The amd64 binary works on OpenWrt's musl since
      # rasputin-agent is CGO_ENABLED=0 static Go.
      - name: Fetch vendored rasputin-agent (control-plane release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Pinned agent version + sha256 — SINGLE SOURCE OF TRUTH is
          # ./agent-version.txt, read here through scripts/agent-pin.sh (shared
          # with canary.yml so the two can't drift). Bump there, with a changelog
          # entry; the version must already be published on the control-plane repo.
          VER=$(./scripts/agent-pin.sh version)
          TARBALL=$(./scripts/agent-pin.sh tarball)
          echo "pinned rasputin-agent: v$VER (from agent-version.txt)"
          mkdir -p /tmp/agent files/usr/bin
          gh release download "v$VER" \
            --repo geekdojo/rasputin-control-plane \
            --pattern "$TARBALL" \
            --dir /tmp/agent --clobber
          # Hash-pin the payload, not just the version (geekdojo/geekdojo-brain#533).
          # A release asset can be replaced after publication, so an unchanged
          # version line never meant unchanged bytes — and these are the bytes that
          # verify every signed image this box will later install. Fails the build
          # rather than baking a binary nobody pinned.
          ./scripts/agent-pin.sh verify "/tmp/agent/$TARBALL"
          tar -xzf "/tmp/agent/$TARBALL" -C files/usr/bin
          chmod +x files/usr/bin/rasputin-agent
          file files/usr/bin/rasputin-agent | head -1

      - name: Inject trust root from org variable
        run: |
          mkdir -p files/etc/rasputin/trust
          printf '%s' "${{ vars.RASPUTIN_ROOT_CA_PEM }}" \
            > files/etc/rasputin/trust/root-ca.pem
          if [ ! -s files/etc/rasputin/trust/root-ca.pem ]; then
            echo "::warning::RASPUTIN_ROOT_CA_PEM org variable is empty — image will ship without a verifiable trust root"
          fi

      # NOTE: no SSH key is injected here — deliberately (pre-GA vendor-key
      # removal, 2026-07-09; a vars.RASPUTIN_SSH_AUTHORIZED_KEY inject step
      # used to live here). The image ships key-LESS and key-ONLY: the
      # 96-rasputin-dropbear-harden uci-defaults disables password auth
      # unconditionally, and the operator's key arrives exclusively via
      # RASPUTIN_SSH_AUTHORIZED_KEY in seed.env (apply-seed) — for us and
      # for end users alike. No seed key → console/LuCI only.

      # PRE-FLIGHT ONLY: fail when upstream's Community Rules tarball no longer
      # matches PINNED_SHA. Break rather than go stale — but break HERE, on a
      # dispatch build, where re-pinning is cheap. The error prints both SHAs and
      # whether the mirror already holds upstream's (re-pin now) or not (refresh
      # the mirror first). Tag builds skip it on purpose: a tag build's rules come
      # from the mirror at the pin, and the tag-guard job has already required
      # this step to pass on the same commit.
      #
      # The step NAME is load-bearing: scripts/rasputin-release-tag-guard.sh looks
      # for exactly "Snort rules freshness gate" in this job. Rename both or
      # neither (scripts/test-release-tag-guard.sh checks they agree).
      - name: Snort rules freshness gate
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: ./scripts/rasputin-snort-rules-freshness.sh

      # Bake the pinned Snort3 Community Rules into files/etc/snort/.
      # ImageBuilder consumes files/ verbatim — the rules must be on disk
      # BEFORE `make image` runs. Downloaded from the org mirror at PINNED_SHA
      # (never snort.org) and verified against it; a mismatch fails closed on
      # every build, tag builds included.
      - name: Fetch Snort3 Community Rules
        run: ./scripts/fetch-snort-rules.sh

      # Bake the OS image version (CalVer) into the overlay. The agent reads
      # /etc/rasputin/image-version at startup and reports it on registration
      # so the control-plane UI can show which image each node runs — critical
      # for troubleshooting and support. The Buildroot OS writes the same file
      # at its build time. Build-generated, NOT committed (a static file would
      # go stale); files/etc/rasputin/image-version is gitignored.
      - name: Bake image version into overlay
        run: |
          mkdir -p files/etc/rasputin
          printf '%s\n' "${{ steps.ver.outputs.version }}" \
            > files/etc/rasputin/image-version

      - name: ImageBuilder build
        env:
          PROFILE: generic
        run: |
          set -euo pipefail
          # Build the PACKAGES list from packages.txt:
          #   1. sed strips trailing inline `# ...` comments per line. Without
          #      this, bash treats embedded `(...)` in a comment as a subshell
          #      and `make image PACKAGES='...'` blows up.
          #   2. grep removes the now-empty / whitespace-only lines (full-line
          #      comments become empty after step 1).
          #   3. tr collapses to a single space-separated list.
          pkgs=$(sed 's/[[:space:]]*#.*$//' packages.txt \
                 | grep -vE '^[[:space:]]*$' \
                 | tr '\n' ' ')
          echo "PACKAGES: $pkgs"
          files_abs=$(realpath files)
          # ImageBuilder's `make image` is the one-shot entrypoint.
          cd imagebuilder
          make image \
            PROFILE="$PROFILE" \
            PACKAGES="$pkgs" \
            FILES="$files_abs" \
            EXTRA_IMAGE_NAME=rasputin \
            -j"$(nproc)"
          echo
          echo "----- output artifacts -----"
          ls -lh bin/targets/x86/64/

      - name: Save ImageBuilder + dl cache
        if: always() && steps.ibcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            imagebuilder
            imagebuilder/dl
          key: ib-${{ hashFiles('scripts/init-imagebuilder.sh', 'packages.txt') }}

      - name: Assemble A/B image (genimage post-process)
        timeout-minutes: 20
        run: |
          set -euo pipefail
          ver="${{ steps.ver.outputs.version }}"
          # genimage re-lays-out ImageBuilder's single-rootfs image into our A/B
          # disk (ESP + rootfs-0/1 + rootfs_data). grub2 tools build our own EFI
          # loader with the loadenv+test modules the boot-counter needs; mtools/
          # fdisk/util-linux extract kernel+rootfs; genimage assembles.
          # Bounded apt: DPkg::Lock::Timeout so it FAILS on a held lock instead of
          # waiting on it forever, DEBIAN_FRONTEND so nothing stops for a prompt.
          # The 2026-08-19 firewall cut lost 2.5 hours to an unbounded apt-get in
          # the smoke job, on top of a 28-minute one in ci.yml the same night.
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq -o DPkg::Lock::Timeout=120
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            -o DPkg::Lock::Timeout=120 \
            genimage mtools fdisk util-linux grub-common grub2-common grub-efi-amd64-bin
          src=$(ls imagebuilder/bin/targets/x86/64/*squashfs-combined-efi.img.gz | head -1)
          test -n "$src" || { echo "::error::squashfs-combined-efi not produced"; exit 1; }
          # OpenWrt's combined-efi .img.gz has trailing NUL padding, so gunzip
          # returns rc=2 ("trailing garbage ignored") though it decompressed fine.
          rc=0
          gunzip -k -f "$src" || rc=$?
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then
            echo "::error::gunzip failed with rc=$rc on $src"; exit "$rc"
          fi
          img="${src%.gz}"
          RASPUTIN_VERSION="$ver" ./scripts/assemble-ab-image.sh "$img" "$ver"

      # Prove the baked rules parse under the Snort THIS image ships: extract
      # rootfs-0 from the A/B disk just assembled, chroot into it, apply the
      # image's own Snort UCI settings and run `snort-mgr -v check`. Runs on
      # every image build, tag builds included — the pin proves which bytes we
      # have, not that Snort accepts them, and the image's snort3 floats with the
      # OpenWrt feed. Before staging, so a failing image is never uploaded.
      - name: Snort rules check (built image)
        timeout-minutes: 15
        run: |
          set -euo pipefail
          # Bounded apt, as above. fdisk (sfdisk) came in with the assemble step.
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            -o DPkg::Lock::Timeout=120 squashfs-tools
          ver="${{ steps.ver.outputs.version }}"
          sudo ./scripts/rasputin-snort-rules-check.sh "ab-out/rasputin-fw-n100-${ver}-ab.img.gz"

      - name: Stage release-shaped names + upload artifact
        run: |
          set -euo pipefail
          mkdir -p staged
          ver="${{ steps.ver.outputs.version }}"
          # assemble-ab-image.sh already emits release-shaped names into ab-out/:
          #   rasputin-fw-n100-<ver>-ab.img.gz         — full A/B disk (initial flash)
          #   rasputin-fw-n100-<ver>.rootfs            — bare rootfs squashfs (OTA artifact)
          #   rasputin-fw-n100-<ver>.rootfs.version    — version sidecar
          cp ab-out/rasputin-fw-n100-"${ver}"-ab.img.gz       staged/
          cp ab-out/rasputin-fw-n100-"${ver}".rootfs          staged/
          cp ab-out/rasputin-fw-n100-"${ver}".rootfs.version  staged/
          # ImageBuilder writes a .manifest (package list) — our SBOM. The canary
          # workflow fetches it from the latest stable to diff against.
          manifest_src=$(ls imagebuilder/bin/targets/x86/64/*.manifest 2>/dev/null | head -1)
          test -n "$manifest_src" || { echo "::error::ImageBuilder manifest not produced"; exit 1; }
          cp "$manifest_src" "staged/rasputin-fw-n100-${ver}.sbom.txt"
          ls -lh staged/

      - uses: actions/upload-artifact@v4
        with:
          name: fw-n100-${{ steps.ver.outputs.version }}
          path: |
            staged/*.img.gz
            staged/*.rootfs
            staged/*.rootfs.version
            staged/*.sbom.txt

  smoke-fw:
    needs: build
    # Run as long as the workflow wasn't cancelled. Boots the A/B disk under
    # QEMU+OVMF and waits for OpenWrt's procd banner / login prompt — this
    # exercises our grub-mkimage EFI + the boot-counter grub.cfg + the genimage
    # GPT layout end-to-end (reaching the banner = slot A booted). It does NOT
    # validate the i226-V driver, line-rate, NAT, or the /overlay-from-rootfs_data
    # mount — those are hardware-only.
    if: ${{ !cancelled() && (startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && (inputs.full_build == true || inputs.full_build == 'true' || inputs.publish == true || inputs.publish == 'true'))) }}
    runs-on: ubuntu-latest
    steps:
      - name: Install QEMU + OVMF
        timeout-minutes: 10
        run: |
          set -eu
          # Bounded apt: DPkg::Lock::Timeout so it FAILS on a held lock instead of
          # waiting on it forever, DEBIAN_FRONTEND so nothing stops for a prompt.
          # The 2026-08-19 firewall cut lost 2.5 hours to an unbounded apt-get in
          # the smoke job, on top of a 28-minute one in ci.yml the same night.
          if command -v qemu-system-x86_64 >/dev/null 2>&1 && [ -e /usr/share/OVMF/OVMF_CODE.fd ]; then
            echo "qemu-system-x86 + ovmf already present"
            exit 0
          fi
          # Acquire::* as well as DPkg::Lock::Timeout, because they cover
          # DIFFERENT hangs and only the lock one was covered before. The lock
          # timeout does nothing for a stalled mirror fetch, and a stalled fetch
          # is what this step did twice on 2026-08-19 — ten minutes of silence,
          # no output at all, while the SAME run's build job had installed its
          # genimage packages through apt minutes earlier.
          # Point apt at the Azure regional mirror before doing anything else.
          # The runners live in Azure; archive.ubuntu.com is the canonical
          # archive and is the thing that actually stalled here — on 2026-08-19
          # this step fetched packages.microsoft.com and dl.google.com in
          # milliseconds, reached archive.ubuntu.com, and then emitted NOTHING
          # for nine and a half minutes until the step timeout. Acquire::*
          # timeouts do not save you from a transfer that trickles rather than
          # dies, so the fix is to stop asking the slow host.
          # Noble uses deb822, older images the one-line format; rewrite both.
          sudo sed -i 's|https\?://archive\.ubuntu\.com|http://azure.archive.ubuntu.com|g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.sources \
            /etc/apt/sources.list.d/*.list 2>/dev/null || true
          APT_OPTS="-o DPkg::Lock::Timeout=120 -o Acquire::Retries=3"
          APT_OPTS="$APT_OPTS -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          # -q not -qq: some output is what tells the next person WHERE it stalled.
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -q $APT_OPTS
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q \
            --no-install-recommends $APT_OPTS qemu-system-x86 ovmf
      - uses: actions/download-artifact@v4
        with:
          pattern: fw-n100-*
          merge-multiple: true
          path: img
      - name: Boot headless, wait for OpenWrt banner
        run: |
          set -x
          # Boot the A/B disk. This is a strong pre-hardware signal: it exercises
          # our grub-mkimage EFI loader, the boot-counter grub.cfg (load_env +
          # slot select), and the genimage GPT layout end-to-end — reaching the
          # OpenWrt banner means slot A booted from the A/B image. (It does NOT
          # validate i226-V/NAT/line-rate or the /overlay-from-rootfs_data mount;
          # those are hardware-only.)
          IMG_GZ=$(ls img/*-ab.img.gz | head -1)
          test -n "$IMG_GZ" || { echo "no A/B .img.gz artifact"; exit 1; }
          IMG=${IMG_GZ%.gz}
          # Tolerate gunzip exit 2 ("trailing garbage ignored") as elsewhere.
          gunzip -kf "$IMG_GZ" || rc=$?
          if [ "${rc:-0}" -ne 0 ] && [ "${rc:-0}" -ne 2 ]; then
            echo "::error::gunzip failed with rc=${rc}"; exit "${rc}"
          fi
          [ -s "$IMG" ] || { echo "::error::decompressed image $IMG missing or empty"; exit 1; }
          # Auto-pick non-secboot OVMF (Ubuntu renamed the files to _4M).
          OVMF_CODE=$(ls /usr/share/OVMF/OVMF_CODE*.fd 2>/dev/null | grep -v secboot | head -1)
          OVMF_VARS=$(ls /usr/share/OVMF/OVMF_VARS*.fd 2>/dev/null | grep -v secboot | head -1)
          cp "$OVMF_VARS" /tmp/vars.fd
          ( timeout 240 qemu-system-x86_64 \
              -machine q35 -m 512 -smp 2 -cpu max -nographic \
              -drive if=pflash,format=raw,readonly=on,file="$OVMF_CODE" \
              -drive if=pflash,format=raw,file=/tmp/vars.fd \
              -drive file="$IMG",format=raw,if=virtio \
              -serial mon:stdio > /tmp/console.log 2>&1 ) &
          QPID=$!
          ok=0
          for _ in $(seq 1 100); do
            if grep -qE "Please press Enter to activate this console|BusyBox v[0-9]|procd: - init complete -" /tmp/console.log; then
              ok=1; break
            fi
            sleep 2
          done
          kill "$QPID" 2>/dev/null || true
          echo "----- last 80 lines of console -----"; tail -80 /tmp/console.log || true
          [ "$ok" = 1 ] || { echo "::error::firewall image did not reach OpenWrt banner in QEMU"; exit 1; }
          echo "OpenWrt firewall image booted in QEMU"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-fw-console
          path: /tmp/console.log

  sign-and-release:
    needs: [build, smoke-fw]
    # Publishes on a tag OR on a dispatch with publish=true (run-number dev release).
    #
    # ⚠️ `success() &&`, not `!cancelled() &&`, and the difference is the whole
    # gate. GitHub implies success() ONLY when an `if:` contains no status-check
    # function; `!cancelled()` IS one, so it REPLACED the implicit requirement
    # that `needs` succeeded. The smoke boot has therefore never gated
    # publishing — it merely had to finish, or not finish, either way.
    #
    # Caught 2026-08-19 the only way this ever gets caught: smoke-fw failed (its
    # QEMU install timed out, so the image was never booted at all) and
    # sign-and-release published 2026.08.4-dev.93 twenty-seven seconds later,
    # signed and into the dev channel, where the control plane offered it as an
    # update to the firewall. A gate that reads like a gate and is not one is
    # worse than no gate, because the release notes say it booted.
    if: ${{ success() && (startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && (inputs.publish == true || inputs.publish == 'true'))) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # The exact commit this run built. Every job's checkout (build included)
      # takes the run's github.sha, so this HEAD is the tree the image came
      # from. The release tag must land HERE, not on whatever main points at
      # when the publish step runs: with no explicit target, GitHub creates a
      # new tag from the default branch at publish time, so a PR merged mid-run
      # tags a commit the image was never built from (2026.08.4-dev.95: built
      # from 3448796, tagged d236520).
      - name: Record built commit
        id: src
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Compute version
        id: ver
        env:
          TARGET_VERSION: ${{ vars.RASPUTIN_VERSION }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            if [ -z "${TARGET_VERSION}" ]; then
              echo "::error::org var RASPUTIN_VERSION is unset — cannot publish a dev release"; exit 1
            fi
            VERSION="${TARGET_VERSION}-dev.${GITHUB_RUN_NUMBER}"
          fi
          case "$VERSION" in
            *-dev*) CHANNEL=dev    ; PRERELEASE=true  ;;
            *)      CHANNEL=stable ; PRERELEASE=false ;;
          esac
          echo "version=$VERSION"       >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL"       >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          pattern: fw-n100-*
          merge-multiple: true
          path: artifacts

      - name: Materialise signing material to tmpfs
        env:
          LEAF_KEY:  ${{ secrets.RASPUTIN_LEAF_KEY }}
          LEAF_CERT: ${{ secrets.RASPUTIN_LEAF_CERT }}
          ROOT_PEM:  ${{ vars.RASPUTIN_ROOT_CA_PEM }}
        run: |
          set -eu
          if [ -z "${LEAF_KEY:-}" ] || [ -z "${LEAF_CERT:-}" ] || [ -z "${ROOT_PEM:-}" ]; then
            echo "::error::missing one of RASPUTIN_LEAF_KEY / RASPUTIN_LEAF_CERT (repo secrets) or RASPUTIN_ROOT_CA_PEM (org variable)"; exit 1
          fi
          sudo mkdir -p /mnt/rasputin-sign
          sudo mount -t tmpfs -o size=8M,mode=0700,uid=$(id -u),gid=$(id -g) tmpfs /mnt/rasputin-sign
          umask 077
          printf '%s' "$LEAF_KEY"  > /mnt/rasputin-sign/leaf.key
          printf '%s' "$LEAF_CERT" > /mnt/rasputin-sign/leaf-chain.pem
          printf '%s' "$ROOT_PEM"  > /mnt/rasputin-sign/root-ca.pem
          # Split leaf-chain into leaf + intermediate (same pattern as
          # rasputin-os; CMS signing needs them separately).
          awk -v leaf=/mnt/rasputin-sign/leaf.pem \
              -v inter=/mnt/rasputin-sign/intermediate.pem \
              '/-----BEGIN CERTIFICATE-----/{i++} {if(i==1)print > leaf; else if(i==2)print > inter}' \
              /mnt/rasputin-sign/leaf-chain.pem
          openssl verify -CAfile /mnt/rasputin-sign/root-ca.pem \
            -untrusted /mnt/rasputin-sign/intermediate.pem \
            /mnt/rasputin-sign/leaf.pem \
            || { echo "::error::leaf cert chain does not verify against root"; exit 1; }

          # PURPOSE, not just chain (geekdojo/geekdojo-brain#526).
          #
          # Chaining to the root says the leaf is ours. It does not say the leaf
          # is allowed to sign FIRMWARE. That authorization is carried in the
          # leaf's extended key usage as 1.3.6.1.4.1.66587.1.1.1, the release
          # purpose OID, and it is the intermediate's signature over the EKU that
          # makes it authorization rather than a naming convention: the holder of
          # a catalog leaf cannot grant themselves the release purpose
          # (rasputin-control-plane artifactsig/eku.go).
          #
          # Everything downstream now enforces the OID — artifactsig on the node,
          # and the laptop-side shell verifier in bootstrap.sh / flash.sh. A
          # release signed by a leaf without it would chain, publish, and then be
          # refused at install and at first flash. Check it at signing time, where
          # the only cost is a failed run.
          #
          # Matched as a WHOLE TOKEN, comma- or line-end delimited: the raw string
          # is a prefix of any future …1.1.1x OID, so a prefix test would accept a
          # purpose that has not been minted yet (geekdojo/geekdojo-brain#474).
          # `x509 -text` rather than `-ext`: -ext does not exist on LibreSSL, and
          # this check is the same shape the laptop verifier runs.
          leaf_eku=$(openssl x509 -in /mnt/rasputin-sign/leaf.pem -noout -text \
            | grep -A1 'X509v3 Extended Key Usage' | tr -d '\r')
          printf '%s\n' "$leaf_eku" \
            | grep -Eq '(^|[ ,])1\.3\.6\.1\.4\.1\.66587\.1\.1\.1([ ,]|$)' \
            || { echo "::error::signing leaf does not carry the release purpose OID 1.3.6.1.4.1.66587.1.1.1. Artifacts it signs would be refused by rasputin-agent and by the first-flash verifier. Got: $leaf_eku"; exit 1; }
          echo "leaf carries the release purpose OID (1.3.6.1.4.1.66587.1.1.1)"

      - name: CMS-sign images + emit manifest.json
        run: |
          set -eu
          mkdir -p release-out
          # The SBOM (.sbom.txt = OpenWrt package manifest) ships
          # alongside the signed images. The canary workflow fetches
          # this from the most recent stable release to diff against
          # the current build's manifest.
          cp artifacts/*.sbom.txt release-out/ 2>/dev/null || true
          cp artifacts/*.rootfs.version release-out/ 2>/dev/null || true
          ver="${{ steps.ver.outputs.version }}"
          built=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          # Detached CMS signature, DER format. The rasputin-agent verifies with:
          #   openssl cms -verify -binary -inform DER -in <sig> -content <file> \
          #     -CAfile /etc/rasputin/trust/root-ca.pem
          sign_file() {
            f="$1"
            openssl cms -sign -binary \
              -in "release-out/$f" \
              -signer   /mnt/rasputin-sign/leaf.pem \
              -certfile /mnt/rasputin-sign/intermediate.pem \
              -inkey    /mnt/rasputin-sign/leaf.key \
              -outform DER \
              -out "release-out/${f}.sig"
          }

          # The firewall A/B release carries TWO signed artifacts under ONE
          # manifest entry (compatible=rasputin-fw-n100):
          #   image  = the full A/B disk (-ab.img.gz)  — INITIAL FLASH
          #   rootfs = the bare rootfs squashfs (.rootfs) — the OTA artifact the
          #            agent OpenWrtABBackend dd's into the inactive slot.
          # `image`/`sha256` stay on the disk so the existing update-Check keeps
          # working; the `rootfs*` fields are what the deploy path consumes once
          # the release-registry `fw` component is flipped to deployable.
          disk=$(cd artifacts && ls rasputin-fw-n100-*-ab.img.gz | head -1)
          rootfs=$(cd artifacts && ls rasputin-fw-n100-*.rootfs | head -1)
          test -n "$disk"   || { echo "::error::no -ab.img.gz artifact to sign"; exit 1; }
          test -n "$rootfs" || { echo "::error::no .rootfs artifact to sign"; exit 1; }
          cp "artifacts/$disk"   "release-out/$disk"
          cp "artifacts/$rootfs" "release-out/$rootfs"
          sign_file "$disk"
          sign_file "$rootfs"

          dsha=$(sha256sum "release-out/$disk"   | awk '{print $1}')
          dsz=$(stat -c%s   "release-out/$disk")
          dsigsha=$(sha256sum "release-out/${disk}.sig" | awk '{print $1}')
          dsigsz=$(stat -c%s   "release-out/${disk}.sig")
          rsha=$(sha256sum "release-out/$rootfs" | awk '{print $1}')
          rsz=$(stat -c%s   "release-out/$rootfs")
          rsigsha=$(sha256sum "release-out/${rootfs}.sig" | awk '{print $1}')
          rsigsz=$(stat -c%s   "release-out/${rootfs}.sig")

          jq -n \
            --arg version "$ver" --arg channel "${{ steps.ver.outputs.channel }}" \
            --arg sku fw-n100 --arg arch amd64 --arg compatible rasputin-fw-n100 \
            --arg image "$disk"   --arg isha "$dsha" --argjson isz "$dsz" \
            --arg isig "${disk}.sig"   --arg isigsha "$dsigsha" --argjson isigsz "$dsigsz" \
            --arg rootfs "$rootfs" --arg rsha "$rsha" --argjson rsz "$rsz" \
            --arg rsig "${rootfs}.sig" --arg rsigsha "$rsigsha" --argjson rsigsz "$rsigsz" \
            --arg signedBy "Rasputin Release ${ver}" --arg built "$built" \
            '{version:$version, channel:$channel, artifacts:[{
               sku:$sku, architecture:$arch, compatible:$compatible, kind:"ab",
               image:$image, sha256:$isha, sizeBytes:$isz,
               sig:$isig, sigSha256:$isigsha, sigSizeBytes:$isigsz,
               rootfs:$rootfs, rootfsSha256:$rsha, rootfsSizeBytes:$rsz,
               rootfsSig:$rsig, rootfsSigSha256:$rsigsha, rootfsSigSizeBytes:$rsigsz,
               signedBy:$signedBy, buildDate:$built}]}' \
            > release-out/manifest.json

          # Sign the MANIFEST too (geekdojo/geekdojo-brain#526).
          #
          # Until this, the two artifacts were signed and the manifest that names
          # them was not — so every consumer that starts from manifest.json
          # (the control plane resolving an update, bootstrap.sh and flash.sh
          # resolving a first flash) took the version, the asset names and the
          # sha256s on HTTPS plus GitHub repo write alone. The sha256 of a signed
          # artifact is only as good as the document it is read from.
          #
          # Same detached DER CMS recipe as the artifacts, and the same one
          # rasputin-os has used for its manifest since 2026.08: the signature
          # embeds leaf + intermediate, so the PUBLIC root CA alone verifies it,
          # with no material from this runner.
          #
          # Old control planes ignore an asset they do not fetch, so publishing
          # the .sig changes nothing for a fielded cluster until the api starts
          # reading it.
          sign_file manifest.json

          # Prove the published verify command passes BEFORE shipping it. A
          # signature that does not verify is worse than none: it is published,
          # it looks like a control, and the first thing it fails is a first
          # flash by a new operator.
          openssl cms -verify -binary -inform DER \
            -in release-out/manifest.json.sig \
            -content release-out/manifest.json \
            -CAfile /mnt/rasputin-sign/root-ca.pem -out /dev/null \
            || { echo "::error::manifest.json.sig does not verify against the root CA"; exit 1; }

          echo "----- release-out/ -----" && ls -lh release-out/
          echo "----- manifest.json -----" && cat release-out/manifest.json

      - name: Wipe signing material
        if: always()
        run: sudo umount /mnt/rasputin-sign 2>/dev/null || true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.version }}
          # --target pins a NEW tag (dispatch-publish) to the built commit. On a
          # tag push the tag already exists and GitHub ignores target_commitish,
          # so that path is unchanged — and there the checked-out commit is the
          # tagged commit anyway.
          TARGET_SHA: ${{ steps.src.outputs.sha }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          set -eu
          PRERELEASE_FLAG=""
          if [ "${{ steps.ver.outputs.prerelease }}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          # Before publishing: a tag already on ANOTHER commit would make
          # gh ignore --target and publish this image under it. Refuse
          # (status 1), and refuse if the remote cannot be read (2). Status 0
          # is the tag-push path (the tag is the checked-out commit); 3 means
          # this run creates the tag.
          created_tag=false
          rc=0
          ./scripts/release-target-guard.sh "$REPO_URL" "$TAG" "$TARGET_SHA" || rc=$?
          case "$rc" in
            0) ;;
            3) created_tag=true ;;
            *) echo "::error::refusing to publish $TAG: see release-target-guard above"; exit 1 ;;
          esac

          gh release create "$TAG" \
            --target "$TARGET_SHA" \
            --title "Rasputin OpenWrt Firewall ${{ steps.ver.outputs.version }}" \
            --notes "Channel: \`${{ steps.ver.outputs.channel }}\`. Artifacts: \`*-ab.img.gz\` is the full A/B disk (INITIAL FLASH — write to the whole disk); \`*.rootfs\` is the bare rootfs squashfs (the OTA artifact the control plane pushes into the inactive slot). Verify signatures with the public root CA (https://rasputin.geekdojo.com/rasputin-root-ca.pem) — \`openssl cms -verify -binary -inform DER -in <file>.sig -content <file> -CAfile rasputin-root-ca.pem\`; verify commands: https://rasputin.geekdojo.com/docs/agents/. Per-asset SHA-256 in \`manifest.json\`, which is itself signed: \`manifest.json.sig\` is a detached DER CMS signature over it, verified the same way. The \`*.sbom.txt\` asset is the package manifest (canary workflow uses this to detect upstream drift)." \
            $PRERELEASE_FLAG \
            release-out/*

          # After publishing: prove the tag landed on the built commit, before
          # the next step locks the release immutable. A tag this run created on
          # the wrong commit is deleted with its release so nothing mis-tagged
          # stays published (the dev.N name is burned; the next dispatch gets a
          # new run number). A tag that existed before this step was pushed by a
          # person and is never deleted. Only a proven mismatch (1) deletes; an
          # unreadable remote fails without touching the release.
          rc=0
          ./scripts/release-target-guard.sh "$REPO_URL" "$TAG" "$TARGET_SHA" || rc=$?
          if [ "$rc" != 0 ]; then
            if [ "$rc" = 1 ] && [ "$created_tag" = true ]; then
              echo "::error::deleting release $TAG and its tag: this run created them on the wrong commit"
              gh release delete "$TAG" --cleanup-tag --yes \
                || echo "::error::could not delete release $TAG; delete it and its tag by hand"
            fi
            exit 1
          fi

      - name: Attempt to lock release as immutable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          # Process discipline: once a tag is published, it MUST NOT be
          # re-cut. GitHub's immutable-releases feature can enforce this
          # at the API level (no edits, no deletion). We PATCH the
          # release with immutable=true right after publishing.
          #
          # IMPORTANT: as of 2026.06.1 bring-up, this PATCH succeeds at
          # the HTTP level but does NOT actually flip the field on
          # private org repos without the immutable-releases feature
          # toggled on at the repo or org level. The API silently
          # accepts the request and leaves immutable=false. So this
          # step is currently an opt-in best-effort:
          #   - If the repo/org has immutable releases enabled
          #     (Settings → General → Releases, or org-tier toggle),
          #     this PATCH will succeed and lock the release.
          #   - If not, we print a ::warning:: that we couldn't lock —
          #     no failure, but visibility in CI logs.
          #
          # Process discipline (never delete/re-cut a tag) is the
          # primary protection regardless. Tag protection rules
          # (Settings → Tags) are a more reliable backstop on
          # this repo/org tier.
          db_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/${{ steps.ver.outputs.version }}" --jq .id)
          result=$(gh api "repos/$GITHUB_REPOSITORY/releases/$db_id" \
                     -X PATCH \
                     -f immutable=true \
                     --jq '.immutable')
          if [ "$result" = "true" ]; then
            echo "::notice::release ${{ steps.ver.outputs.version }} locked immutable=true"
          else
            echo "::warning::PATCH immutable=true did not take effect on this release (immutable=$result). The feature likely needs enablement at Settings → General → Releases or via org-tier toggle. Process discipline + Settings → Tags protection rules are the working backstop until then."
          fi
