name: canary

# Weekly drift + OpenWrt-currency detector. Builds the same firewall image
# we'd ship for a release, diffs the resulting package manifest against the
# latest stable release's manifest, checks whether the pinned OpenWrt base is
# behind its latest point release, checks whether the pinned Snort rules
# tarball still matches upstream, and checks that the pinned rules still parse
# under the Snort this week's feed ships. If packages drifted, the base is
# behind, the rules pin is stale (or its freshness could not be checked), or
# the rules no longer parse, opens (or updates) a GitHub issue with a suggested
# cut command.
#
# Every check here REPORTS; none of them may fail the run. A detector that
# dies on a finding reports nothing, and its silence is indistinguishable from
# a clean week — see the Snort rules step below for the two weeks this repo
# lost to exactly that. The rules themselves are the exception that proves the
# rule: they come from the org mirror at PINNED_SHA and are VERIFIED, and a
# mirror that serves the wrong bytes does fail the run. That is not a finding
# about the world; it is a supply-chain alarm, and a red run is the right noise.
#
# (Generic image CVE scanners — trivy/osv — were retired 2026-07-20: proven
# unable to read OpenWrt package data. OpenWrt owns ~all packages here and
# ships fixes as point releases + feed updates, so currency IS the CVE
# signal; the one non-OpenWrt component, rasputin-agent, is CVE-watched by
# the control-plane's vuln-scan.yml. See the base-currency step below.)
#
# What this DOES NOT do:
#   - Tag anything.
#   - Publish a release.
#   - Bump the OpenWrt base pin (that's a deliberate human step — base
#     upgrades have already bitten us twice and need real-hardware
#     re-validation, not automation).
#
# Detection is automated; decision (cut a new MICRO?) is always human.
# See the wiki backlog (projects/rasputin/backlog/) and the release-cadence
# discussion for the rationale.

on:
  schedule:
    # Mondays 08:00 UTC — start of week, before any human normally
    # touches the repo. Run is cheap (~3 min warm cache) so we could
    # go daily later if signal warrants.
    - cron: "0 8 * * 1"
  workflow_dispatch:
    inputs:
      force_issue:
        description: "Open an issue even if no drift / CVEs detected"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write    # for opening the canary report issue

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- build the same image we'd ship --------------------------------
      # These steps mirror release.yml's build job exactly. If you edit
      # one, edit both. (Refactor candidate: extract to a reusable
      # workflow once we have a second image / second release pipeline
      # to share with.)

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true

      - name: Restore ImageBuilder + dl cache
        uses: actions/cache/restore@v4
        with:
          path: |
            imagebuilder
            imagebuilder/dl
          key: ib-${{ hashFiles('scripts/init-imagebuilder.sh', 'packages.txt') }}
          restore-keys: ib-

      - name: Init OpenWrt ImageBuilder
        run: ./scripts/init-imagebuilder.sh

      - name: Fetch vendored rasputin-agent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Pinned agent version — read from ./agent-version.txt, the SAME
          # single source release.yml uses, so this build mirrors a real
          # release and the pin can't drift. Bump in agent-version.txt only.
          VER=$(grep -vE '^[[:space:]]*#|^[[:space:]]*$' agent-version.txt | head -n1 | tr -d '[:space:]')
          [ -n "$VER" ] || { echo "::error::agent-version.txt has no version line"; exit 1; }
          echo "pinned rasputin-agent: v$VER (from agent-version.txt)"
          mkdir -p /tmp/agent files/usr/bin
          gh release download "v$VER" \
            --repo geekdojo/rasputin-control-plane \
            --pattern "rasputin-agent-${VER}-linux-amd64.tar.gz" \
            --dir /tmp/agent --clobber
          tar -xzf /tmp/agent/rasputin-agent-${VER}-linux-amd64.tar.gz \
            -C files/usr/bin
          chmod +x files/usr/bin/rasputin-agent

      - name: Inject trust root from org variable
        run: |
          mkdir -p files/etc/rasputin/trust
          printf '%s' "${{ vars.RASPUTIN_ROOT_CA_PEM }}" \
            > files/etc/rasputin/trust/root-ca.pem

      # A stale rules pin is a FINDING here, not a build failure. Talos republishes
      # the Community Rules tarball roughly weekly, so upstream moving away from
      # PINNED_SHA is not an anomaly, it is the schedule. When this step used to
      # fail closed on it, the detector was killable by the thing it detects:
      # from 2026-09-07 every canary run died right here, never reached the
      # package diff, the base-currency check or the steps that file the issue,
      # and two weeks of silence read as "no drift" when what we actually had
      # was a dead canary.
      #
      # Since geekdojo/geekdojo-brain#208 the two questions are separate. The
      # rules this build bakes come from the org mirror at PINNED_SHA, verified
      # — the same bytes a release would bake, so this image is a real candidate
      # build, never one carrying unverified rules. THEN, with REPORT_DRIFT=1,
      # upstream is compared with the pin and the answer is written as step
      # outputs — rules_drift (true | false | unknown), rules_pinned_sha,
      # rules_actual_sha, rules_mirror_status — and the step exits 0 on any
      # upstream answer, including snort.org being unreachable. The decide and
      # body steps below carry the finding into the issue, like package drift
      # and base currency.
      #
      # release.yml runs the same comparison WITHOUT the flag on its pre-flight
      # (dispatch) builds, where a stale pin fails the build — that is where
      # freshness is enforced; here it is only reported.
      - name: Fetch Snort3 Community Rules
        id: rules
        env:
          REPORT_DRIFT: "1"
        run: ./scripts/fetch-snort-rules.sh

      # Mirror release.yml: bake an image-version file into the overlay so the
      # canary image matches the released layout. Canary computes no CalVer
      # (it's a drift-detection build, not a release), so a clearly-labelled
      # placeholder is used. Build-generated, gitignored — never committed.
      #
      # The image is still a measurement, not a release: no step uploads it (the
      # artifact step publishes canary-out/ only), no release job consumes this
      # job, and the version string reads "0.0.0-canary" so it is unmistakable on
      # a box if one ever escaped by hand.
      - name: Bake image version into overlay
        run: |
          mkdir -p files/etc/rasputin
          printf '%s\n' "0.0.0-canary" \
            > files/etc/rasputin/image-version

      - name: ImageBuilder build
        env:
          PROFILE: generic
        run: |
          set -euo pipefail
          pkgs=$(sed 's/[[:space:]]*#.*$//' packages.txt \
                 | grep -vE '^[[:space:]]*$' \
                 | tr '\n' ' ')
          files_abs=$(realpath files)
          cd imagebuilder
          make image \
            PROFILE="$PROFILE" \
            PACKAGES="$pkgs" \
            FILES="$files_abs" \
            EXTRA_IMAGE_NAME=rasputin \
            -j"$(nproc)"
          ls -lh bin/targets/x86/64/

      - name: Patch GRUB cmdline (mirror release.yml)
        timeout-minutes: 15
        run: |
          set -euo pipefail
          # Bounded apt: DPkg::Lock::Timeout so it FAILS on a held lock instead of
          # waiting on it forever, DEBIAN_FRONTEND so nothing stops for a prompt.
          # The 2026-08-19 firewall cut lost 2.5 hours to an unbounded apt-get in
          # the smoke job, on top of a 28-minute one in ci.yml the same night.
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            --no-install-recommends -o DPkg::Lock::Timeout=120 mtools fdisk
          src=$(ls imagebuilder/bin/targets/x86/64/*squashfs-combined-efi.img.gz | head -1)
          rc=0
          gunzip -k -f "$src" || rc=$?
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then
            echo "::error::gunzip rc=$rc"; exit "$rc"
          fi
          img="${src%.gz}"
          ./scripts/patch-image-cmdline.sh "$img"
          gzip -f "$img"

      # Mirror release.yml's "Snort rules check (built image)": do the pinned
      # rules parse under the snort3 THIS week's feed put in the image? The
      # image's Snort floats with the OpenWrt feed, so a feed update can break
      # rules that parsed last week, and the next release build would fail on it.
      # Same script, pointed at the rootfs of the single-rootfs combined-efi image
      # (partition 2 — the canary does not assemble the A/B disk).
      #
      # REPORTS, never fails the run (see the header): the exit code becomes
      # result=pass | fail (Snort rejected the rules) | error (the check could not
      # run), and the decide + body steps carry it into the issue.
      - name: Snort rules check (built image)
        id: rules_check
        timeout-minutes: 15
        run: |
          set -uo pipefail
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            -o DPkg::Lock::Timeout=120 squashfs-tools fdisk \
            || { echo "::warning::could not install squashfs-tools/fdisk — rules check not run"; echo "result=error" >> "$GITHUB_OUTPUT"; exit 0; }
          src=$(ls imagebuilder/bin/targets/x86/64/*squashfs-combined-efi.img.gz | head -1)
          rc=0
          sudo ROOTFS_PARTITION=2 ./scripts/rasputin-snort-rules-check.sh "$src" || rc=$?
          case "$rc" in
            0) result=pass ;;
            1) result=fail; echo "::warning::the pinned Snort rules do NOT parse under this image's snort3 — the next release build will fail its rules check" ;;
            *) result=error; echo "::warning::the Snort rules check could not run (exit $rc)" ;;
          esac
          echo "result=$result" >> "$GITHUB_OUTPUT"

      # --- capture this build's SBOM and the build summary ---------------

      - name: Capture build SBOM (OpenWrt package manifest)
        id: sbom
        run: |
          set -euo pipefail
          mkdir -p canary-out
          # ImageBuilder's manifest filename is
          # openwrt-<ver>-<arch>-<profile>.manifest — shared across
          # squashfs/ext4 flavors (package set is identical).
          mfst=$(ls imagebuilder/bin/targets/x86/64/*.manifest 2>/dev/null | head -1)
          test -n "$mfst" || { echo "::error::ImageBuilder manifest not produced"; exit 1; }
          cp "$mfst" canary-out/current.sbom.txt
          echo "Manifest captured: $(wc -l < canary-out/current.sbom.txt) packages"
          src=$(ls imagebuilder/bin/targets/x86/64/*squashfs-combined-efi.img.gz | head -1)
          echo "img=$src" >> "$GITHUB_OUTPUT"

      # --- fetch baseline (latest stable release's SBOM) -----------------

      - name: Fetch latest stable release SBOM for diff
        id: baseline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          # Latest stable = most recent release that's NOT a prerelease.
          # 2026.06.0 was published before sbom.txt was attached to
          # releases, so the first canary may find no baseline. That's
          # OK — we'll just report "first canary; current packages list
          # attached for reference" and the diff will work starting
          # from the next stable cut.
          latest=$(gh release list --repo "$GITHUB_REPOSITORY" \
                   --limit 30 --json tagName,isPrerelease \
                   --jq '[.[] | select(.isPrerelease==false)][0].tagName' \
                   || true)
          if [ -z "$latest" ] || [ "$latest" = "null" ]; then
            echo "no stable release yet — first canary"
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "have_baseline=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "baseline_tag=$latest"
          echo "tag=$latest" >> "$GITHUB_OUTPUT"
          # The asset name follows release.yml's stage step:
          #   rasputin-fw-n100-<ver>.sbom.txt
          if gh release download "$latest" --repo "$GITHUB_REPOSITORY" \
               --pattern '*.sbom.txt' --dir canary-out/baseline 2>/dev/null; then
            mv canary-out/baseline/*.sbom.txt canary-out/baseline.sbom.txt
            rmdir canary-out/baseline 2>/dev/null || true
            echo "have_baseline=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::no .sbom.txt on $latest (probably pre-canary release); skipping diff"
            echo "have_baseline=false" >> "$GITHUB_OUTPUT"
          fi

      # --- diff packages ------------------------------------------------

      - name: Diff packages
        id: diff
        run: |
          set -eu
          if [ "${{ steps.baseline.outputs.have_baseline }}" != "true" ]; then
            echo "no baseline → diff is the empty set"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "table=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # OpenWrt manifest format: `pkgname - version` per line.
          # Build name→version maps for both, then a 3-way diff.
          awk '{print $1 " " $NF}' canary-out/baseline.sbom.txt | sort > /tmp/baseline.tsv
          awk '{print $1 " " $NF}' canary-out/current.sbom.txt  | sort > /tmp/current.tsv
          # join on name; show old/new version
          join -a1 -a2 -e '(absent)' -o '0,1.2,2.2' /tmp/baseline.tsv /tmp/current.tsv \
               > /tmp/joined.tsv
          # Find rows where version actually changed (col2 != col3)
          awk '$2 != $3 { print }' /tmp/joined.tsv > /tmp/changes.tsv

          if [ ! -s /tmp/changes.tsv ]; then
            echo "no package changes since baseline"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "table=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "package changes detected:"
          cat /tmp/changes.tsv

          # Render a markdown table that the issue body can embed.
          {
            printf '| Package | Baseline (%s) | Canary |\n' "${{ steps.baseline.outputs.tag }}"
            printf '|---|---|---|\n'
            awk '{
              kind = ($2 == "(absent)") ? "**ADDED**" :
                     ($3 == "(absent)") ? "**REMOVED**" : ""
              printf("| `%s` | %s | %s %s |\n", $1, $2, $3, kind)
            }' /tmp/changes.tsv
          } > canary-out/diff.md
          echo "changed=true" >> "$GITHUB_OUTPUT"
          # Pass table content via heredoc-style $GITHUB_OUTPUT
          {
            echo 'table<<DIFFEOF'
            cat canary-out/diff.md
            echo 'DIFFEOF'
          } >> "$GITHUB_OUTPUT"

      # --- OpenWrt base currency ----------------------------------------
      # The trivy + osv-scanner CVE arm was RETIRED here on 2026-07-20. It was
      # proven (runs 29778507877 + 29781990561) to be structurally incapable of
      # reading an OpenWrt image: trivy `vm` detects 0 packages / no OS
      # (Metadata:null, 0 Results), and osv reports "no package sources found".
      # Neither has an opkg analyzer. Path-fixing them changed nothing.
      #
      # The right model: OpenWrt owns ~every package in this image, and ships
      # security fixes AS point releases + feed updates. So the actionable
      # signal is CURRENCY, not per-package CVE matching (which would duplicate
      # OpenWrt's own security process with worse data). Two arms cover it:
      #   - package DRIFT (below): catches feed updates landing on rebuild.
      #   - base CURRENCY (this step): catches a newer base point release.
      # Our only non-OpenWrt component, the rasputin-agent binary, is CVE-watched
      # upstream by the control-plane's vuln-scan.yml (govulncheck) before it is
      # vendored here. There is no clean machine-readable OpenWrt advisory feed
      # to wire in (advisories are split across the announce list, release notes,
      # and GitHub advisories), so the issue points the human at the point-release
      # notes for the "what does bumping fix" detail.
      - name: Check OpenWrt base currency
        id: base
        run: |
          set -euo pipefail
          pinned=$(sed -n 's/.*OPENWRT_VERSION:-\([0-9.]*\)}.*/\1/p' scripts/init-imagebuilder.sh | head -1)
          series=$(echo "$pinned" | cut -d. -f1-2)
          # Highest point release in the pinned series from the downloads index.
          latest=$(curl -sfL https://downloads.openwrt.org/releases/ \
            | grep -oE "${series}\.[0-9]+" | sort -V | uniq | tail -1 || true)
          echo "pinned=$pinned latest=${latest:-unknown}"
          echo "pinned=$pinned" >> "$GITHUB_OUTPUT"
          echo "latest=${latest:-unknown}" >> "$GITHUB_OUTPUT"
          if [ -n "$latest" ] && [ "$latest" != "$pinned" ]; then
            echo "behind=true" >> "$GITHUB_OUTPUT"
          else
            echo "behind=false" >> "$GITHUB_OUTPUT"
          fi

      # --- decide + report ----------------------------------------------

      - name: Decide whether to open an issue
        id: decide
        run: |
          set -eu
          drift="${{ steps.diff.outputs.changed }}"
          behind="${{ steps.base.outputs.behind }}"
          rules="${{ steps.rules.outputs.rules_drift }}"
          rules_check="${{ steps.rules_check.outputs.result }}"
          force="${{ github.event.inputs.force_issue }}"
          # Open an issue if ANY of: package drift detected, the OpenWrt base
          # is behind its latest point release, the pinned Snort rules tarball
          # no longer matches upstream (or that could not be checked), the
          # pinned rules do not parse under this image's Snort (or that could
          # not be checked), manually forced.
          #
          # Each rules finding is sufficient ON ITS OWN, because each one blocks
          # releases: release.yml's pre-flight fails its freshness gate on a stale
          # pin, a tag build needs a green pre-flight, and every image build fails
          # its rules check on rules Snort rejects. That is precisely the state
          # nobody was told about for two weeks while the canary was dying at the
          # fetch step instead of reporting from it. "Could not check" opens an
          # issue too: a check that silently did not run reads as a clean week.
          if [ "$drift" = "true" ] || [ "$behind" = "true" ] \
             || [ "$rules" = "true" ] || [ "$rules" = "unknown" ] \
             || [ "$rules_check" != "pass" ] || [ "$force" = "true" ]; then
            echo "open_issue=true" >> "$GITHUB_OUTPUT"
          else
            echo "open_issue=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build issue body
        if: steps.decide.outputs.open_issue == 'true'
        id: body
        run: |
          set -eu
          today=$(date -u +%Y-%m-%d)
          baseline="${{ steps.baseline.outputs.tag }}"
          [ -n "$baseline" ] || baseline="(no prior stable)"

          # Compute the next stable MICRO. If baseline is YYYY.MM.N,
          # suggest YYYY.MM.(N+1); else suggest this month's .0.
          if echo "$baseline" | grep -qE '^[0-9]{4}\.[0-9]{2}\.[0-9]+$'; then
            base_ym=$(echo "$baseline" | cut -d. -f1-2)
            base_micro=$(echo "$baseline" | cut -d. -f3)
            suggested="${base_ym}.$((base_micro + 1))"
          else
            suggested=$(date -u +%Y.%m.0)
          fi

          {
            echo "## Canary report — $today"
            echo
            echo "Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo "### Package changes since \`${baseline}\`"
            if [ "${{ steps.diff.outputs.changed }}" = "true" ]; then
              echo
              cat canary-out/diff.md
            else
              echo
              echo "_No package version changes detected._"
            fi
            echo
            echo "### OpenWrt base currency"
            echo
            echo "OpenWrt owns ~every package in this image and ships security fixes as point"
            echo "releases + feed updates, so currency (not per-package CVE scanning) is the signal."
            if [ "${{ steps.base.outputs.behind }}" = "true" ]; then
              echo
              echo "⚠️ **Base is behind:** pinned \`${{ steps.base.outputs.pinned }}\`, latest in series is \`${{ steps.base.outputs.latest }}\`."
              echo "Bump \`OPENWRT_VERSION\` in \`scripts/init-imagebuilder.sh\`, rebuild, re-validate on hardware."
              echo "What the bump fixes: see the [\`${{ steps.base.outputs.latest }}\` release notes](https://downloads.openwrt.org/releases/${{ steps.base.outputs.latest }}/) / the openwrt-announce list."
            else
              echo
              echo "✅ On the latest point release in the series (\`${{ steps.base.outputs.pinned }}\`)."
            fi
            echo
            echo "_The rasputin-agent binary (our only non-OpenWrt component) is CVE-watched separately by the control-plane's \`vuln-scan.yml\`. Generic image CVE scanners (trivy/osv) were retired — proven unable to read OpenWrt package data._"
            echo
            echo "### Snort rules pin"
            if [ "${{ steps.rules.outputs.rules_drift }}" = "true" ]; then
              # Short prefixes for the commit subject only — the table below and
              # the PINNED_SHA line carry the full digests, and every prior
              # re-pin commit in this repo is titled with 8-char prefixes.
              old8=$(printf '%s' "${{ steps.rules.outputs.rules_pinned_sha }}" | cut -c1-8)
              new8=$(printf '%s' "${{ steps.rules.outputs.rules_actual_sha }}" | cut -c1-8)
              echo
              echo "⚠️ **The pinned Snort3 Community Rules tarball no longer matches upstream.** Talos republishes it roughly weekly, so this is routine — but it is also *blocking*: release.yml's pre-flight (dispatch) build fails its freshness gate on a stale pin, and a tag build needs a green pre-flight on its commit, so **no release can be cut until the pin is bumped.**"
              echo
              echo "| | sha256 |"
              echo "|---|---|"
              echo "| Pinned (\`PINNED_SHA\`) | \`${{ steps.rules.outputs.rules_pinned_sha }}\` |"
              echo "| Upstream today | \`${{ steps.rules.outputs.rules_actual_sha }}\` |"
              echo
              if [ "${{ steps.rules.outputs.rules_mirror_status }}" != "present" ]; then
                echo "**The mirror does not hold upstream's tarball yet** (status: \`${{ steps.rules.outputs.rules_mirror_status }}\`). Refresh the mirror first (\`gh workflow run rasputin-refresh.yml --repo geekdojo/rasputin-snort3-rules-mirror\`) and wait for release \`sha256-${{ steps.rules.outputs.rules_actual_sha }}\` to exist — builds fetch from the mirror, so a pin it does not hold breaks every build."
                echo
              fi
              echo "Remediation — once the mirror holds it: bump the pin, verify, commit:"
              echo
              echo '```sh'
              echo "# 1. In scripts/fetch-snort-rules.sh set:"
              echo "#      PINNED_SHA=\"${{ steps.rules.outputs.rules_actual_sha }}\""
              echo "#    and add a line to the history comment above it, as every prior re-pin has."
              echo "# 2. Fetch from the mirror and verify against the new pin (must print 'sha256 verified'):"
              echo "FORCE=1 ./scripts/fetch-snort-rules.sh"
              echo "# 3. Commit the bump:"
              echo "git commit -am 'snort: re-pin community rules $old8 -> $new8 (Talos republish)'"
              echo '```'
              echo
              echo "_This canary run baked the rules at the current pin, fetched from the mirror and verified, so the package diff above is real and the report is complete._"
            elif [ "${{ steps.rules.outputs.rules_drift }}" = "unknown" ]; then
              echo
              echo "⚠️ **Could not check the rules pin against upstream this run** — snort.org did not answer. Freshness is unknown, not fresh. Check by hand: \`./scripts/rasputin-snort-rules-freshness.sh\`. (The rules this run baked are the verified pin, from the mirror.)"
            else
              echo
              echo "✅ Upstream tarball still matches \`PINNED_SHA\` (\`${{ steps.rules.outputs.rules_pinned_sha }}\`)."
            fi
            echo
            echo "### Snort rules check"
            case "${{ steps.rules_check.outputs.result }}" in
              pass)
                echo
                echo "✅ The pinned rules parse under this image's snort3 (\`snort-mgr -v check\`)." ;;
              fail)
                echo
                echo "❌ **The pinned rules do NOT parse under the snort3 in this week's feed.** Every release build runs the same check and will fail until this is resolved — the image's Snort version floats with the OpenWrt feed. The rejected rules and Snort's errors are in the \`Snort rules check (built image)\` step log of the workflow run above." ;;
              *)
                echo
                echo "⚠️ **The Snort rules check did not run** (result: \`${{ steps.rules_check.outputs.result }}\`) — see the \`Snort rules check (built image)\` step log. Unknown is not a pass." ;;
            esac
            echo
            echo "### Suggested action"
            echo
            if [ "${{ steps.diff.outputs.changed }}" = "true" ] || \
               [ "${{ steps.base.outputs.behind }}" = "true" ] || \
               [ "${{ steps.rules.outputs.rules_drift }}" = "true" ]; then
              echo "Cut \`$suggested\`. A tag build refuses to start without a green pre-flight on the exact commit it tags, so pre-flight first:"
              echo
              echo '```sh'
              echo "gh workflow run release.yml -f full_build=true --ref main   # wait for it to go green"
              echo "git tag -a $suggested -m \"canary $today — pick up OpenWrt base / package updates\""
              echo "git push origin $suggested"
              echo '```'
              echo
              echo "If a base bump drove this, update \`OPENWRT_VERSION\` first."
              echo "If a stale rules pin drove this, bump \`PINNED_SHA\` first (after the mirror holds the new tarball) — the pre-flight's freshness gate fails on a stale pin."
              if [ "${{ steps.rules_check.outputs.result }}" != "pass" ]; then
                echo "Resolve the Snort rules check above first — every release build runs it."
              fi
            elif [ "${{ steps.rules.outputs.rules_drift }}" = "unknown" ] || \
                 [ "${{ steps.rules_check.outputs.result }}" != "pass" ]; then
              echo "_Nothing to cut from this run: resolve the Snort rules findings above._"
            else
              echo "_Forced issue: no drift or base update to act on._"
            fi
            echo
            echo "---"
            echo "*This issue was opened by the canary workflow. Close once acted on or after triage.*"
          } > canary-out/issue-body.md
          cat canary-out/issue-body.md

      - name: Upload canary artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canary-${{ github.run_id }}
          path: canary-out/

      - name: Ensure 'canary' label exists
        if: steps.decide.outputs.open_issue == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          # Idempotent — create-if-not-exists. gh label create errors
          # noisily if the label exists already; --force does an update
          # in place which is what we actually want for both paths.
          gh label create canary \
            --repo "$GITHUB_REPOSITORY" \
            --color FFD700 \
            --description "Opened by the canary workflow — review and act" \
            --force

      - name: Open / update canary issue
        if: steps.decide.outputs.open_issue == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          today=$(date -u +%Y-%m-%d)
          # The title names every arm that can raise this issue. A run whose only
          # finding is a stale rules pin must not arrive under a heading that
          # says "package drift / OpenWrt base update" — this repo has already
          # fixed one canary title that had gone stale against its own checks.
          title="Canary $today — package drift / OpenWrt base / snort rules pin"
          # Close any stale open canary issues older than this one to
          # avoid pile-up. (Bryce can re-open if needed.)
          gh issue list --repo "$GITHUB_REPOSITORY" \
            --label canary --state open --json number,title \
            --jq '.[] | "\(.number)\t\(.title)"' \
            | while IFS=$'\t' read -r num oldtitle; do
                if [ "$oldtitle" != "$title" ]; then
                  echo "closing stale canary issue #$num: $oldtitle"
                  gh issue close "$num" --repo "$GITHUB_REPOSITORY" \
                    --comment "Superseded by today's canary run."
                fi
              done
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "$title" \
            --label canary \
            --body-file canary-out/issue-body.md
