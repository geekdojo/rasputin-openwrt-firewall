##
## ci.yml — the only workflow that gates a PULL REQUEST on this repo.
##
## WHY IT EXISTS (geekdojo/geekdojo-brain#147)
##   Until 2026-08-16 nothing validated a change on its way in. release.yml carries a
##   `validate` job, but it is tag/dispatch-triggered, so it only ever ran at RELEASE
##   time — the point at which a finding is most expensive. cla.yml was the sole
##   pull_request trigger, which meant "all checks green" on a PR meant one CLA check
##   and nothing about the code.
##
##   That is not theoretical: PR #26 merged an init script at mode 644. On a fresh flash
##   it could not be enabled, so the IPv6 re-assert it shipped never ran and the WAN kept
##   a live second address family. Caught only by hand afterwards (#27).
##
## WHAT IT RUNS
##   scripts/validate-files.sh — the single source of truth for these checks, invoked
##   identically here and from release.yml's validate job. Deliberately a script rather
##   than inline steps: this repo has already been bitten by the same configuration
##   living in two workflows and drifting out of sync (the agent-version.txt pin), and a
##   check that disagrees with itself is worse than no check.
##   Plus the behavioural tests release.yml's validate job also runs:
##   scripts/test-node-id.sh, scripts/test-bus-pin.sh, scripts/test-set-root-hash.sh,
##   scripts/test-mgmt-harden.sh, scripts/test-seed-scrub.sh,
##   scripts/test-snort-rules-pin.sh, scripts/test-release-tag-guard.sh and
##   scripts/test-release-target-guard.sh.
##   And the functional test of the image rules check (scripts/test-snort-rules-check.sh),
##   run against the latest stable image: release builds run that check on every image,
##   so a regression in it must surface on the PR, not at release time.
##   And the functional test of the seed -> UCI -> agent environment path
##   (scripts/test-apply-seed.sh): this branch's files/ inside the latest stable
##   image's userland, under chroot.
##
## PERMISSIONS
##   Read-only. This workflow never publishes, tags, or touches a release; it has no
##   reason to hold write scope, and a PR from a fork must not acquire one.
##
name: ci

on:
  pull_request:
  # Also on pushes to main, so a direct commit (the solo-dev path this repo uses for
  # small fixes) is not exempt from the checks a PR would have faced.
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  # A newer push supersedes an in-flight run on the same ref — these checks are cheap
  # and stateless, so there is nothing to preserve in a run that is already stale.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-files:
    name: Validate shipped files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax, executable modes, and required paths
        run: ./scripts/validate-files.sh

      # The node id is the username the agent presents to the bus, and the
      # control plane accepts only a DNS label. An id that breaks the rule
      # builds, boots and passes every check above — the box just never joins —
      # so the check is table-tested under dash, bash and
      # busybox ash (the box's shell; REQUIRE_BUSYBOX fails the step if the
      # runner ever stops shipping it). (geekdojo/geekdojo-brain#441)
      - name: Node-id helper tests
        timeout-minutes: 5
        env:
          REQUIRE_BUSYBOX: "1"
        run: sh scripts/test-node-id.sh

      # The bus pin check apply-seed runs on RASPUTIN_BUS_PIN must accept exactly
      # what the agent accepts (geekdojo/geekdojo-brain#448): the agent's own
      # refusal vectors, plus 64 pins computed with openssl and their
      # non-canonical siblings, under dash, bash and busybox ash.
      - name: Bus-pin helper tests
        timeout-minutes: 5
        env:
          REQUIRE_BUSYBOX: "1"
        run: sh scripts/test-bus-pin.sh

      # set-root-hash installs a control-plane-delivered root password hash into
      # /etc/shadow (geekdojo/geekdojo-brain#558). It must accept a real crypt
      # hash and rewrite only root's field, and fail closed on a plaintext or a
      # shadow-corrupting value while never echoing the candidate — none of
      # which a syntax check sees. Table-tested under dash, bash and busybox ash.
      - name: set-root-hash helper tests
        timeout-minutes: 5
        env:
          REQUIRE_BUSYBOX: "1"
        run: sh scripts/test-set-root-hash.sh

      # rasputin-mgmt-harden re-asserts, every boot, the two management-plane
      # floors: uhttpd bound to loopback (geekdojo/geekdojo-brain#559) and a
      # non-empty unusable root field (geekdojo/geekdojo-brain#503). Both must be
      # idempotent — a steady-state boot changes nothing and never clobbers a
      # delivered root hash. Driven against a mock uci and a scratch shadow.
      - name: mgmt-harden helper tests
        timeout-minutes: 5
        run: sh scripts/test-mgmt-harden.sh

      # The seed scrub blanks a credential on a FAT during first-boot
      # provisioning, where uci-defaults self-delete and there is no second
      # chance — syntax and mode checks cannot see it doing the wrong thing.
      # dosfstools + REQUIRE_FAT make the real-filesystem and label-discovery
      # tiers MANDATORY here: they skip on a developer Mac, and a runner that
      # can run them and silently doesn't is the failure this flag prevents.
      # (geekdojo/geekdojo-brain#130)
      #
      # ⚠️ Both steps are BOUNDED, and the first version of them was not. On the
      # very first run — PR #32 — `sudo apt-get update` blocked on the runner's
      # dpkg lock and sat in_progress for over half an hour. A required check
      # that hangs is worse than one that fails: it never reports, so nothing
      # downstream can tell "still working" from "wedged", and the PR merged
      # with that check still pending. An unbounded wait in CI is the same bug
      # as an unbounded wait anywhere else.
      - name: Ensure mkfs.vfat is available
        timeout-minutes: 5
        run: |
          # Skip the package manager entirely when the tool is already here —
          # which on the hosted images it usually is. apt is the slowest and by
          # far the least reliable part of this job, so the best version of this
          # step is the one that does nothing.
          if command -v mkfs.vfat >/dev/null 2>&1; then
            echo "dosfstools already present at $(command -v mkfs.vfat)"
            exit 0
          fi
          # DPkg::Lock::Timeout so apt FAILS on a held lock instead of waiting
          # on it forever, and DEBIAN_FRONTEND so nothing can stop for a prompt
          # no one is there to answer.
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq -o DPkg::Lock::Timeout=120
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq -o DPkg::Lock::Timeout=120 dosfstools

      - name: Seed-scrub functional test
        timeout-minutes: 5
        env:
          REQUIRE_FAT: "1"
        run: ./scripts/test-seed-scrub.sh

      # The Snort rules pin (mirror fetch + SHA verification), the pre-flight
      # freshness gate and its canary report mode, against fixture tarballs
      # served locally. No network. (geekdojo/geekdojo-brain#208)
      - name: Snort rules pin tests
        timeout-minutes: 5
        run: ./scripts/test-snort-rules-pin.sh

      # The release tag guard's decision logic, against fixture Actions API
      # responses, plus a check that release.yml still has the step it looks for.
      - name: Tag guard tests
        timeout-minutes: 5
        run: ./scripts/test-release-tag-guard.sh

      # release.yml's publish step runs scripts/release-target-guard.sh before
      # and after `gh release create` to prove the tag is on the commit the
      # image was built from. Every exit status, against a throwaway git remote
      # with lightweight, annotated and nested tags. No network.
      - name: Release target guard tests
        timeout-minutes: 5
        run: ./scripts/test-release-target-guard.sh

  apply-seed:
    name: Seed to agent environment (functional)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Ensure unsquashfs and sfdisk are available
        timeout-minutes: 5
        run: |
          if command -v unsquashfs >/dev/null 2>&1 && command -v sfdisk >/dev/null 2>&1; then
            echo "squashfs-tools + fdisk already present"
            exit 0
          fi
          # Bounded: fail on a held lock instead of waiting forever.
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq -o DPkg::Lock::Timeout=120
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq -o DPkg::Lock::Timeout=120 squashfs-tools fdisk

      # This branch's files/ over the latest stable image's rootfs, under chroot:
      # the real busybox sources the seed, the real uci stores it, and the real
      # init.d/rasputin-agent reads it back into the agent's environment (only
      # procd's calls are stubbed). Covers the bus pin end to end, a malformed
      # pin refused with nothing applied, RASPUTIN_BUS_KEY never applied and
      # blanked, and sysupgrade's keep list carrying both pin locations.
      # (geekdojo/geekdojo-brain#448)
      - name: apply-seed functional test
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/test-apply-seed.sh

  snort-rules-check:
    name: Snort rules check (functional)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Ensure unsquashfs and sfdisk are available
        timeout-minutes: 5
        run: |
          if command -v unsquashfs >/dev/null 2>&1 && command -v sfdisk >/dev/null 2>&1; then
            echo "squashfs-tools + fdisk already present"
            exit 0
          fi
          # Bounded, as above: fail on a held lock instead of waiting forever.
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq -o DPkg::Lock::Timeout=120
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq -o DPkg::Lock::Timeout=120 squashfs-tools fdisk

      # Runs the REAL rules check (extract rootfs-0, chroot, snort-mgr -v check)
      # against the latest stable image: its own rules must pass; a broken rule,
      # an empty ruleset and a missing partition must each fail.
      - name: Rules check functional test
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/test-snort-rules-check.sh
