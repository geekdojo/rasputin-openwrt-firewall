# Decision #9: Rasputin is IPv4-only — disable IPv6 across the whole stack. This
# is the kernel-level lever on the firewall (compute/controlplane ship IPv4-only
# kernels; OpenWrt builds IPv6 in, so we disable it at runtime). The network
# config side (delete wan6, no LAN RA/ULA) is in uci-defaults/97-rasputin-disable-ipv6.
# Applied by OpenWrt's /etc/init.d/sysctl (reads /etc/sysctl.d/*.conf).
#
# ⚠ THIS FILE ALONE IS NOT ENOUGH, and the reason is not visible from here.
# The stock sysctl init is START=11; netifd starts at START=20 and re-enables
# `disable_ipv6` per device as it brings each one up, so on a real boot the WAN
# (eth1) ends up with IPv6 LIVE despite every line below. init.d/rasputin-ipv4-only
# (START=99) re-applies this file once netifd has settled — that script's header
# carries the measurements. Editing this file without it changes nothing on the
# interfaces netifd manages. (#132, bench 2026-08-16.)
net.ipv6.conf.all.disable_ipv6=1
net.ipv6.conf.default.disable_ipv6=1
net.ipv6.conf.lo.disable_ipv6=1
