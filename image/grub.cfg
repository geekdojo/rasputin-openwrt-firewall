# GRUB config — Rasputin firewall (OpenWrt, N100/amd64). Custom A/B
# boot-counter with rollback, NO RAUC.
#
# Ported from the compute image's boot-counter
# (rasputin-os/board/rasputin/n100/grub.cfg), adapted for OpenWrt paths:
#   - each slot boots the kernel its own rootfs carries, read straight from
#     that slot's squashfs at /boot/vmlinuz (geekdojo/geekdojo-brain#893). A
#     kernel and its rootfs are one build: /lib/modules in a slot only fits the
#     kernel it was built with. So an OTA, which replaces only the slot, brings
#     its kernel with it, and no agent writes a kernel to the ESP.
#   - a rootfs that carries no kernel (every release before #893) boots the
#     shared /boot/vmlinuz on the ESP. That file is the 2026.10.3 kernel, on
#     every box and in every fresh image, and is never rewritten, so a
#     downgrade to an older release boots the kernel it was built with.
#   - the slot is found by partition number on the disk GRUB booted from:
#     rootfs-0 is gpt3, rootfs-1 is gpt4 (image/genimage.cfg; the build's
#     scripts/check-boot-layout.sh fails on any other order). GRUB 2.12 cannot
#     search by partition label, and a squashfs has no UUID.
#   - under a GRUB EFI from before #893 (no squash4, xzio or regexp module),
#     `regexp` is an unknown command, $disk stays empty, the -f test fails and
#     each entry boots the shared kernel. This file is therefore safe under the
#     old EFI too, which is what makes the one-time EFI + grub.cfg repair safe
#     to do in either order.
#   - grubenv is /boot/grub/grubenv (== OpenWrt grub $prefix), so `load_env`
#     with no args finds it. (Compute's Buildroot grub prefix is /EFI/BOOT.)
#   - root is the squashfs A/B partition by PARTLABEL (rootfs-0 / rootfs-1).
#     OpenWrt mounts /overlay from the partition labelled `rootfs_data` (our
#     shared persistent partition), so config survives a slot switch — this is
#     why the firewall A/B path also fixes the old sysupgrade keep.d-bypass
#     problem: a slot flash never touches rootfs_data.
#
# Contract (agent OpenWrtABBackend, agent/internal/updater/openwrt_ab.go):
# grubenv carries ORDER + per-slot <slot>_OK / <slot>_TRY. The backend writes:
#   activate (post-install) → target_OK=1 target_TRY=0 ORDER="<target> <other>"
#   mark-good               → <booted>_OK=1 <booted>_TRY=0 (and drops <booted>_REPAIR)
#   mark-bad                → <booted>_OK=0
#   repair-slot-boot        → <booted>_TRY=0 <booted>_REPAIR=1 after writing this
#                             file and the EFI to the ESP; <booted>_OK=0 when it cannot
# <slot>_REPAIR is the agent's own marker; this file never reads or saves it,
# and save_env below names only the keys it owns, so it survives every boot.
# The attempt counter lives HERE: we consume one try per enabled slot and boot
# the first OK+untried slot; a slot that boots but never reaches the agent's
# boot-time mark-good (panic/hang) keeps TRY=1 and is skipped next boot, falling
# through to the other slot. Slot A (rootfs-0) is the safe fallback.
#
# The i915 args (i915.modeset=0 i915.enable_guc=0) are baked into every menuentry
# here — the N100 kernel has i915 built in with no bundled GuC firmware, so
# without these the framebuffer console stalls ~262 s and dmesg fills with drm
# errors (diagnosed on CWWK 2026-06-07). This replaces the old, image-patching
# scripts/patch-image-cmdline.sh — authoring grub.cfg directly subsumes it.

set timeout=3
set default=0
# `default` is GRUB's menu index (0 = slot A). `selected` is a SEPARATE flag for
# "did the loop actually pick a bootable slot?" — needed because default=0 cannot
# distinguish "slot A chosen" from "nothing chosen" (see the cleanup below).
# Ported from rasputin-os 0df25c1 (geekdojo/geekdojo-brain#888, F-888-01).
set selected=0

# Serial for OUTPUT only. Do NOT make serial a terminal_input: the kernel logs
# to console=ttyS0 right up to a reboot, so on a warm reboot the serial buffer
# holds leftover bytes GRUB would read as a keypress, cancelling the auto-boot
# timeout and hanging at the menu (same gotcha caught on the compute bench).
serial --unit=0 --speed=115200
terminal_output serial console
terminal_input console

# Defaults BEFORE load_env: a missing or corrupt grubenv then degrades to
# "boot slot A", never a brick.
set ORDER="A B"
set A_OK=1
set A_TRY=0
set B_OK=0
set B_TRY=0
load_env

# Select a bootable slot (one try per enabled slot).
for SLOT in $ORDER; do
    if [ "$SLOT" = "A" ]; then
        INDEX=0
        OK=$A_OK
        TRY=$A_TRY
        A_TRY=1
    fi
    if [ "$SLOT" = "B" ]; then
        INDEX=1
        OK=$B_OK
        TRY=$B_TRY
        B_TRY=1
    fi
    if [ "$OK" -eq 1 ]; then
        if [ "$TRY" -eq 0 ]; then
            set default=$INDEX
            set selected=1
            break
        fi
    fi
done

# If nothing was selectable (all enabled slots already tried), un-consume their
# tries so they're retried next boot instead of locking to the fallback. Keyed on
# `selected`, NOT `default`: default=0 is also slot A's real index, so testing
# `default -eq 0` ran this cleanup every time slot A was chosen and un-consumed
# A's try — a hung or bad OTA on slot A then boot-looped forever instead of
# rolling back to B (its failed try never stuck). Slot B was unaffected.
if [ "$selected" -eq 0 ]; then
    if [ "$A_OK" -eq 1 ]; then
        if [ "$A_TRY" -eq 1 ]; then set A_TRY=0; fi
    fi
    if [ "$B_OK" -eq 1 ]; then
        if [ "$B_TRY" -eq 1 ]; then set B_TRY=0; fi
    fi
fi

save_env ORDER A_OK A_TRY B_OK B_TRY

# The disk GRUB booted from: $root is the ESP, "hd0,gpt1", so $disk is "hd0".
regexp --set=1:disk '^([^,]+),' "$root"

# Each slot boots its own kernel from its squashfs, or the shared /boot/vmlinuz
# on the ESP when its rootfs carries none (see the header). Root is the
# squashfs A/B partition by PARTLABEL. rasputin.slot is a redundant marker the
# agent also accepts (it primarily reads PARTLABEL from the cmdline).
menuentry "Rasputin Firewall (slot A)" --id rootfs.0 {
    if [ -f ($disk,gpt3)/boot/vmlinuz ]; then
        linux ($disk,gpt3)/boot/vmlinuz root=PARTLABEL=rootfs-0 rootfstype=squashfs rootwait ro rasputin.slot=A i915.modeset=0 i915.enable_guc=0 console=ttyS0,115200 console=tty1
    else
        linux /boot/vmlinuz root=PARTLABEL=rootfs-0 rootfstype=squashfs rootwait ro rasputin.slot=A i915.modeset=0 i915.enable_guc=0 console=ttyS0,115200 console=tty1
    fi
}
menuentry "Rasputin Firewall (slot B)" --id rootfs.1 {
    if [ -f ($disk,gpt4)/boot/vmlinuz ]; then
        linux ($disk,gpt4)/boot/vmlinuz root=PARTLABEL=rootfs-1 rootfstype=squashfs rootwait ro rasputin.slot=B i915.modeset=0 i915.enable_guc=0 console=ttyS0,115200 console=tty1
    else
        linux /boot/vmlinuz root=PARTLABEL=rootfs-1 rootfstype=squashfs rootwait ro rasputin.slot=B i915.modeset=0 i915.enable_guc=0 console=ttyS0,115200 console=tty1
    fi
}
