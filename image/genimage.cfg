# Rasputin firewall A/B disk layout (OpenWrt, N100/amd64).
#
# Mirrors the compute image's layout (rasputin-os/board/rasputin/n100/genimage.cfg)
# — GPT, ESP + two squashfs rootfs slots + a shared persistent partition — but the
# inputs come from OpenWrt ImageBuilder instead of Buildroot (see
# scripts/assemble-ab-image.sh, which stages esp-stage/ + rootfs.squashfs into
# --inputpath before this runs). The A/B-ness lives HERE, not in the build system:
# ImageBuilder produces a single-rootfs image; genimage re-lays-it-out as A/B.
#
# genimage sets each GPT partition's PARTLABEL from the block name below, so the
# kernel's root=PARTLABEL=rootfs-0|rootfs-1 (image/grub.cfg) resolves. IMPORTANT:
# genimage's parser does NOT accept `#` comments inside `{ … }` blocks — keep
# notes here.
#
# The persistent partition is labelled `rootfs_data` (its ext4 filesystem label,
# set by scripts/assemble-ab-image.sh — NOT `persistent` like compute). x86
# OpenWrt does NOT auto-mount a labelled partition as /overlay — the dev.44 QEMU
# boot proved its rootdisk backend overlays on the ACTIVE root partition's slack
# (per-slot, not shared). What actually mounts this partition at /overlay is
# extroot: the baked files/etc/config/fstab (commit cd4b7e6) mounts the
# `rootfs_data` label on both slots. This shared, never-slot-flashed partition
# is what makes config survive a slot switch (fixes the old sysupgrade
# keep.d-bypass problem).

image esp.vfat {
	vfat {
		# 11-char max FAT label. RASPUTINEFI — matches the compute ESP label,
		# and NOT RASPUTIN-FW: that label now belongs to the SEED partition
		# below (so it auto-mounts on a laptop; an ESP does not). GRUB reads
		# this partition via EFI firmware + the bootable flag, never by FS
		# label; only the agent's grubenv writer resolves it by label, and it
		# prefers RASPUTINEFI (agent/internal/updater/openwrt_ab.go).
		label = "RASPUTINEFI"
		# esp-stage/{EFI,boot} are assembled by scripts/assemble-ab-image.sh:
		#   EFI/BOOT/bootx64.efi   — OpenWrt's grub EFI loader (from ImageBuilder)
		#   boot/vmlinuz           — the kernel (from ImageBuilder), shared by slots
		#   boot/grub/grub.cfg     — image/grub.cfg (our A/B boot-counter)
		#   boot/grub/grubenv      — initialised: ORDER="A B", both slots good
		file EFI {
			image = "esp-stage/EFI"
		}
		file boot {
			image = "esp-stage/boot"
		}
	}
	size = 64M
}

# The provisioning seed on its OWN Microsoft-basic-data FAT — mirrors the
# compute image (rasputin-os/board/rasputin/n100/genimage.cfg). macOS/Windows
# auto-mount a basic-data FAT (an ESP they do not), so one flash.sh writes the
# seed to either image by its label. LABEL keeps RASPUTIN-FW — the operator-
# facing seed label, distinct from compute's RASPUTIN-OS, so a firewall seed
# can't be flashed onto a compute disk. Ships EMPTY (98-rasputin-seed uses a
# non-empty `-s` test, so an empty seed reads as "unseeded"); the operator or
# the flasher drops the real rasputin-seed.env / seed.env here.
image seed.vfat {
	vfat {
		label = "RASPUTIN-FW"
		file rasputin-seed.env {
			image = "rasputin-seed.env"
		}
	}
	size = 32M
}

image disk.img {
	hdimage {
		partition-table-type = "gpt"
	}

	partition esp {
		partition-type-uuid = c12a7328-f81f-11d2-ba4b-00a0c93ec93b  # EFI System
		bootable = "true"
		image = "esp.vfat"
	}

	# Inserting the seed here shifts rootfs-0/1 + rootfs_data DOWN one partition
	# number. That is safe: grub roots by PARTLABEL (rootfs-0/1), fstab extroot
	# mounts by FS label (rootfs_data), rasputin-growpart resolves the overlay
	# partition from /proc/mounts, and the agent finds the squashfs slots by
	# block-info mount/type — nothing here resolves a partition by number.
	partition seed {
		partition-type-uuid = ebd0a0a2-b9e5-4433-87c0-68b6b72699c7  # Microsoft basic data
		image = "seed.vfat"
	}

	partition rootfs-0 {
		partition-type-uuid = 4f68bce3-e8cd-4db1-96e7-fbcaf984b709  # x86-64 root
		image = "rootfs.squashfs"
		size = 1G
	}

	partition rootfs-1 {
		partition-type-uuid = 4f68bce3-e8cd-4db1-96e7-fbcaf984b709
		# Pre-populate slot B with the same rootfs at flash so the box has a
		# working fallback before its first OTA (grubenv ships both slots OK).
		# The first update overwrites B and activates it; A stays the rollback
		# target.
		image = "rootfs.squashfs"
		size = 1G
	}

	partition rootfs_data {
		partition-type-uuid = 0fc63daf-8483-4772-8e79-3d69d8477de4  # Linux data
		# A pre-formatted, empty ext4 labelled `rootfs_data` (built by
		# scripts/assemble-ab-image.sh). extroot (files/etc/config/fstab) mounts
		# THIS at /overlay on both slots, so config survives a slot switch. x86
		# OpenWrt won't pick a labelled partition for /overlay on its own, hence
		# the explicit extroot. 512M today; grown to the medium tail later by
		# rasputin-growpart / resize2fs.
		image = "rootfs_data.ext4"
	}
}
